:root{
  --night:#1c1329; --night2:#130d1d; --candle:#f2b866; --lilac:#a993c9;
  --page:#f7f0e3; --ink:#2b2331; --muted:#7a6f80; --mark:rgba(242,184,102,.38);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Crimson Text","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --fs:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:#efe6f5;font-family:var(--ui)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Library ---------- */
#library{position:fixed;inset:0;overflow-y:auto;padding:max(28px,env(safe-area-inset-top)) 22px 40px;
  background:radial-gradient(120% 60% at 50% -10%,rgba(242,184,102,.22),transparent 60%),linear-gradient(var(--night),var(--night2))}
.brand{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.brand img{width:44px;height:44px;border-radius:12px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.3px;margin:0}
.tag{color:var(--lilac);margin:0 0 26px;font-size:15px}
.shelf .empty{grid-column:1/-1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 18px}
.book{position:relative;text-align:left}
.cover{aspect-ratio:2/3;min-height:0;width:100%;border-radius:4px 10px 10px 4px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--c1,#4b2c6b),var(--c2,#1d1230));
  box-shadow:inset 6px 0 0 rgba(0,0,0,.25),0 14px 30px -12px rgba(0,0,0,.8),0 0 40px -18px rgba(242,184,102,.5);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 60% 22%,rgba(255,217,143,.35),transparent 70%)}
.cover b{position:relative;font-family:var(--serif);font-size:22px;line-height:1.08;color:#fff6e6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.series{position:absolute;top:8px;left:10px;z-index:1;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.38);color:#ffe9c4;border-radius:999px;padding:3px 8px 3px 6px;font:600 12px var(--ui)}
.series svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cover i{position:relative;font-style:normal;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#e7d7f3;margin-top:6px;opacity:.85}
.meta{font-size:13px;color:var(--lilac);margin-top:8px}
.bar{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--candle)}
.more{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px;line-height:32px;text-align:center}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.pill{border:1px solid rgba(169,147,201,.45);border-radius:999px;padding:11px 18px;font-size:15px}
.pill.gold{background:var(--candle);color:#24160a;border-color:var(--candle);font-weight:600}
.pill.danger{background:#a8323e;color:#fff;border-color:#a8323e;font-weight:600}
.pill.danger-ghost{color:#f2a6ae;border-color:rgba(242,166,174,.45)}
.note-small{color:var(--muted);font-size:13px;margin-top:18px;line-height:1.5;max-width:520px}

.acct{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(169,147,201,.5);display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);font-family:var(--serif);font-size:20px;color:var(--candle)}
.acct svg{width:24px;height:24px;stroke:#efe6f5;fill:none;stroke-width:1.7;stroke-linecap:round}
#profile{position:fixed;inset:0;overflow-y:auto;padding:max(18px,env(safe-area-inset-top)) 22px 40px;background:linear-gradient(var(--night),var(--night2))}
.pf-top{display:flex;align-items:center;gap:6px;margin-bottom:10px}.pf-top h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0}
.pf-top .ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pf-head{display:flex;align-items:center;gap:16px;margin:14px 0 26px}
.avatar{width:72px;height:72px;min-width:72px;border-radius:50%;background:linear-gradient(160deg,var(--candle),#c47a3a);color:#24160a;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;font-weight:600}
.pf-name{background:none;border:0;border-bottom:1px dashed rgba(169,147,201,.4);color:#fff6e6;font:600 22px var(--serif);padding:2px 0;width:100%}
.pf-sub{color:var(--lilac);font-size:13px;margin-top:6px;word-break:break-all}
#profile h4{font-family:var(--serif);color:var(--candle);font-weight:600;font-size:17px;margin:24px 0 6px}
.pf-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.pf-row b{display:block;font-weight:600;font-size:15px}.pf-row small{display:block;color:var(--lilac);font-size:12px;margin-top:3px}
.pf-row .pill{padding:8px 14px;font-size:14px;white-space:nowrap}
.fld{display:block;margin:12px 0}.fld span{display:block;color:var(--lilac);font-size:13px;margin-bottom:6px}
.fld input{width:100%;border-radius:12px;border:1px solid rgba(169,147,201,.4);background:#1a1226;color:#efe6f5;padding:12px;font:16px var(--ui)}
.link{color:var(--candle);text-decoration:underline;font-size:13px;padding:4px 0}
button:disabled{opacity:.6}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;background:var(--page);color:var(--ink)}
#reader.sepia{--page:#efe2c6;--ink:#3a2c1c;--muted:#8a7559}
#reader.dark{--page:#16101f;--ink:#d9cfe2;--muted:#8d82a0;--mark:rgba(242,184,102,.28)}
#viewport{position:absolute;left:0;right:0;top:calc(max(6px,env(safe-area-inset-top)) + 46px);bottom:calc(max(6px,env(safe-area-inset-bottom)) + 46px);overflow:hidden}
#content{height:100%;padding:0 26px;column-gap:52px;column-fill:auto;font-family:var(--serif);font-size:var(--fs);
  line-height:1.62;will-change:transform;transition:transform .28s ease}
#content.nomove{transition:none}
#content h2{font-weight:600;font-size:1.45em;line-height:1.2;margin:.4em 0 1.1em;break-after:avoid}
#content h2 small{display:block;font-size:.55em;font-weight:400;color:var(--muted);letter-spacing:.5px;margin-bottom:.5em}
#content p{margin:0;text-indent:1.4em;text-align:left;hyphens:none;-webkit-hyphens:none;overflow-wrap:normal}
#content p.first,#content hr+p{text-indent:0}
#content hr{border:0;text-align:center;margin:1em 0;height:1.4em}
#content hr:after{content:"\2022  \2022  \2022";color:var(--muted);letter-spacing:.6em}
#content p.letter{font-style:italic;text-indent:0;margin:.35em 0}
#content mark{background:var(--mark);color:inherit;border-radius:2px;cursor:pointer}
#content p.pnote:after{content:" \270E";color:var(--candle);font-size:.8em}
.runhead{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 16px);left:26px;right:26px;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.foot{position:absolute;bottom:calc(max(6px,env(safe-area-inset-bottom)) + 16px);left:26px;right:26px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chrome{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 10px;
  background:var(--night);color:#efe6f5;transition:transform .2s ease}
.chrome.top{top:0;height:calc(max(6px,env(safe-area-inset-top)) + 46px);padding:max(6px,env(safe-area-inset-top)) 10px 0}
.chrome.bottom{bottom:0;justify-content:space-around;height:calc(max(6px,env(safe-area-inset-bottom)) + 46px);padding:0 10px max(6px,env(safe-area-inset-bottom))}
.chrome.top.off{transform:translateY(-110%)} .chrome.bottom.off{transform:translateY(110%)}
.chrome .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.ib{min-width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:14px}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,6,16,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;z-index:21;background:#241a33;color:#efe6f5;border-radius:18px 18px 0 0;
  padding:18px 20px max(22px,env(safe-area-inset-bottom));overflow-y:auto;box-shadow:0 -20px 40px rgba(0,0,0,.4)}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:4px 0 14px}
.toc a{display:block;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07);color:inherit;text-decoration:none;font-size:15px}
.toc .part{font-family:var(--serif);color:var(--candle);font-size:15px;margin:16px 0 4px}
.toc a.cur{color:var(--candle)}
.row{display:flex;align-items:center;gap:10px;margin:14px 0}
.row label{min-width:86px;color:var(--lilac);font-size:14px}
.seg{display:flex;gap:8px;flex:1}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(169,147,201,.35);font-size:14px}
.seg button.on{border-color:var(--candle);color:var(--candle)}
input[type=range]{flex:1;accent-color:var(--candle)}
.nitem{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.nitem q{display:block;font-family:var(--serif);color:#d9c8a4;font-size:14px;quotes:none}
.nitem .nt{margin:6px 0;font-size:15px}
.nitem .nm{font-size:12px;color:var(--lilac);display:flex;gap:14px;align-items:center}
.nitem .nm button{color:var(--candle);font-size:13px;padding:6px 0}
.sheet .pill{color:#efe6f5}
.empty{color:var(--lilac);font-size:14px;line-height:1.5}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid rgba(169,147,201,.4);background:#1a1226;color:#efe6f5;
  padding:12px;font:16px/1.5 var(--ui);resize:vertical}
#addNote{position:fixed;z-index:15;background:var(--night);color:var(--candle);border-radius:999px;padding:10px 16px;font-size:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2e2342;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:14px;z-index:40;max-width:86%;text-align:center}
#warn{cursor:pointer;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:#4a2330;color:#ffe;padding:10px 14px;border-radius:10px;font-size:13px;z-index:50}
#content p.reading{background:var(--mark);border-radius:4px;box-shadow:0 0 0 4px var(--mark)}
#reader.listening #viewport{bottom:calc(max(6px,env(safe-area-inset-bottom)) + 112px)}
#player{position:absolute;left:12px;right:12px;bottom:calc(max(6px,env(safe-area-inset-bottom)) + 52px);z-index:6;height:54px;
  background:var(--night);color:#efe6f5;border-radius:16px;display:flex;align-items:center;gap:2px;padding:0 6px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
#player .ib{min-width:42px}
#player .rate{flex:1;text-align:center;font-size:14px;color:var(--candle);font-variant-numeric:tabular-nums}
#player .play{background:var(--candle);color:#24160a;border-radius:50%;width:42px;height:42px;min-width:42px}
#player .play svg{fill:currentColor;stroke:none}
.vlist button{display:block;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.vlist button.on{color:var(--candle)}
.vlist small{display:block;color:var(--lilac);font-size:12px;margin-top:2px}
@media (prefers-reduced-motion:reduce){#content,.chrome{transition:none}}
</style>
</head>

<script>
const EMBEDDED_BOOKS = [];
</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- storage ---------- */
let LS=null; try{localStorage.setItem("_t","1");localStorage.removeItem("_t");LS=localStorage}catch(e){}
const mem={};
const kv={get(k,d){try{const v=LS?LS.getItem(k):mem[k];return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){const s=JSON.stringify(v);try{LS?LS.setItem(k,s):(mem[k]=s)}catch(e){toast("Couldn't save. Storage is full.")}}};
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("nooklight",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"});
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function idbAll(){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction("books").objectStore("books").getAll();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function idbPut(b){return new Promise(res=>{if(!db)return res(false);try{const t=db.transaction("books","readwrite");t.objectStore("books").put(b);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
function idbDel(id){return new Promise(res=>{if(!db)return res();try{const t=db.transaction("books","readwrite");t.objectStore("books").delete(id);t.oncomplete=()=>res()}catch(e){res()}})}

/* ---------- state ---------- */
let books=[], book=null, flat=[], chIdx=0, page=0, pages=1;
const S=Object.assign({theme:"light",fs:19,autoFull:true,rate:1,voice:""},kv.get("settings",{}));
const notesKey=id=>"notes:"+id, posKey=id=>"pos:"+id;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),2600)}
function cmpVer(a,b){return (+a||0)-(+b||0)}

async function loadLibrary(){
  await openDB();
  if(!LS||!db){const w=$("#warn");w.innerHTML="This phone isn't letting Nooklight save. Notes will be lost when you close it, so export them before you leave. <b style='white-space:nowrap;margin-left:6px;text-decoration:underline'>OK</b>";w.classList.remove("hidden");const hide=()=>w.classList.add("hidden");w.onclick=hide;setTimeout(hide,8000)}
  const stored=await idbAll(); const map={};
  EMBEDDED_BOOKS.forEach(b=>map[b.id]=b);
  stored.forEach(b=>{if(!map[b.id]||cmpVer(b.version,map[b.id].version)>=0)map[b.id]=b});
  const removed=kv.get("removed",[]);
  books=Object.values(map).filter(b=>!removed.includes(b.id)).sort((a,b)=>((a.series||a.title)+"").localeCompare((b.series||b.title)+"")||(a.seriesNo||0)-(b.seriesNo||0));
  renderShelf();
}
function flatten(b){const out=[];(b.parts||[]).forEach((p,pi)=>p.chapters.forEach(c=>out.push(Object.assign({part:p.title,pi},c))));return out}
function progress(b){const p=kv.get(posKey(b.id),null);if(!p)return 0;const n=flatten(b).length||1;return Math.min(100,Math.round(((p.ch||0)+(p.f||0))/n*100))}

function renderShelf(){
  const sh=$("#shelf");
  if(!books.length){sh.innerHTML=(sb&&!me)?'<p class="empty">Sign in with the circle at the top right to see your books and books shared with you.</p>':'<p class="empty">No books yet. Tap "Import a book" and choose a book file.</p>';return}
  sh.innerHTML=books.map(b=>{const pr=progress(b),n=kv.get(notesKey(b.id),[]).length;
    return `<div class="book"><button class="cover" data-open="${esc(b.id)}" style="--c1:${esc(b.color1||"#5a2f73")};--c2:${esc(b.color2||"#1a1029")}">
      ${b.seriesNo?`<span class="series" title="${esc(b.series||"")} book ${esc(b.seriesNo)}"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>${esc(b.seriesNo)}</span>`:""}<b>${esc(b.title)}</b><i>${esc(b.subtitle||"")}</i></button>
      <button class="more" data-more="${esc(b.id)}" aria-label="Book options">&#8942;</button>
      <div class="meta">${pr}% read${n?` &middot; ${n} note${n>1?"s":""}`:""}</div>
      <div class="bar"><span style="width:${pr}%"></span></div></div>`}).join("");
}
$("#shelf").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"),m=e.target.closest("[data-more]");
  if(m){bookMenu(books.find(b=>b.id===m.dataset.more));return}
  if(o){openBook(books.find(b=>b.id===o.dataset.open))}
});

/* ---------- import book ---------- */
$("#importBookBtn").onclick=()=>$("#bookFile").click();
$("#bookFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f)return;
  try{const b=JSON.parse(await f.text());
    if(b.format!=="nooklight-book"||!b.id||!b.parts)throw 0;
    const ok=await idbPut(b);
    kv.set("removed",kv.get("removed",[]).filter(x=>x!==b.id));
    const i=books.findIndex(x=>x.id===b.id); if(i>=0)books[i]=b; else books.push(b);
    renderShelf(); toast(ok?`Added "${b.title}". Your notes are kept.`:`Opened "${b.title}", but it couldn't be saved on this phone.`);
    if(await uploadIfSignedIn(b))toast(`"${b.title}" saved to your account (private).`);

function paintNotes(){
  const cid=flat[chIdx].id;
  getNotes().filter(n=>n.ch===cid).forEach(n=>{
    let p=$(`#content p[data-i="${n.para}"]`);
    if(!(p&&wrap(p,n))){ // reattach by searching the chapter
      const all=[...document.querySelectorAll("#content p[data-i]")];
      const hit=all.find(x=>x.textContent.replace(/\s+/g," ").includes(n.quote.slice(0,80)));
      if(hit){n.para=+hit.dataset.i;wrap(hit,n)} else if(p)p.classList.add("pnote");
    }
  });
}
function wrap(p,n){
  const q=(n.quote||"").replace(/\s+/g," ").trim(); if(!q)return false;
  const nodes=[];let txt="";const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){nodes.push([w.currentNode,txt.length]);txt+=w.currentNode.nodeValue}
  const norm=txt.replace(/\s/g," ");let at=norm.indexOf(q);let len=q.length;
  if(at<0){at=norm.indexOf(q.slice(0,60));len=Math.min(60,q.length);if(at<0)return false}
  const end=at+len;
  nodes.forEach(([node,start])=>{const s=Math.max(at,start),e=Math.min(end,start+node.nodeValue.length);if(s>=e)return;
    const r=document.createRange();r.setStart(node,s-start);r.setEnd(node,e-start);
    const m=document.createElement("mark");m.dataset.n=n.id;try{r.surroundContents(m)}catch(err){}});
  return true;
}

/* ---------- listen ---------- */
const TTS=window.speechSynthesis;
const L={on:false,playing:false,para:0,parts:[],pi:0,token:0,wake:null};
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function voiceScore(v){let s=0;const n=(v.name||"").toLowerCase();
  if(/natural|neural|enhanced|premium|wavenet|studio|journey/.test(n))s+=5;
  if(/google/.test(n))s+=2; if(/en-(us|gb|au)/i.test(v.lang))s+=1; if(v.localService)s+=1; return s}
function englishVoices(){return (TTS?TTS.getVoices():[]).filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}
function pickVoice(){const vs=englishVoices();return vs.find(v=>v.voiceURI===S.voice)||vs[0]||null}
if(TTS)TTS.onvoiceschanged=()=>{};
function firstParaOnPage(){const W=$("#viewport").clientWidth;const ps=[...document.querySelectorAll("#content p[data-i]")];
  const p=ps.find(x=>Math.floor(x.offsetLeft/W)>=page);return p?+p.dataset.i:-1}
function speakable(t){return t.replace(/\s+/g," ").replace(/\u2014/g,", ").replace(/\*/g,"").trim()}
function chunk(t){const out=[];(t.match(/[^.!?\u2026]+[.!?\u2026]+["\u201d\u2019)]*\s*|[^.!?\u2026]+$/g)||[t]).forEach(s=>{s=s.trim();if(!s)return;
  if(out.length&&out[out.length-1].length+s.length<180)out[out.length-1]+=" "+s;else out.push(s)});return out}
function markReading(i){document.querySelectorAll("#content p.reading").forEach(p=>p.classList.remove("reading"));
  const p=$(`#content p[data-i="${i}"]`);if(!p)return;p.classList.add("reading");
  const pg=pageOfPara(i);if(pg!==page){page=pg;render()}}
function stopSpeech(){L.token++;if(TTS)TTS.cancel();L.playing=false;updatePlayer()}
function speakFrom(i){
  if(!TTS){toast("This phone doesn't support reading aloud.");return}
  stopSpeech();L.playing=true;updatePlayer();
  const ps=[...document.querySelectorAll("#content p[data-i]")].map(p=>+p.dataset.i);
  if(i<0||!ps.length){return nextChapterListen()}
  if(!ps.includes(i))i=ps.find(x=>x>=i)??-1;
  if(i<0)return nextChapterListen();
  L.para=i;markReading(i);
  const el=$(`#content p[data-i="${i}"]`);
  let text=speakable(el.textContent);
  if(i===ps[0]&&page===0){const h=$("#content h2");if(h)text=speakable(h.lastChild.textContent)+". . "+text}
  L.parts=chunk(text);L.pi=0;sayPart(L.token);
}
function sayPart(tok){
  if(tok!==L.token)return;
  if(L.pi>=L.parts.length){const ps=[...document.querySelectorAll("#content p[data-i]")].map(p=>+p.dataset.i);
    const nx=ps.find(x=>x>L.para);setTimeout(()=>{if(tok!==L.token)return;nx===undefined?nextChapterListen():speakFrom(nx)},280);return}
  const u=new SpeechSynthesisUtterance(L.parts[L.pi]);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
  u.rate=S.rate;u.pitch=1;
  u.onend=()=>{if(tok!==L.token)return;L.pi++;setTimeout(()=>sayPart(tok),90)};
  u.onerror=e=>{if(tok!==L.token||e.error==="interrupted"||e.error==="canceled")return;L.pi++;sayPart(tok)};
  TTS.speak(u);
}
function nextChapterListen(){
  if(chIdx>=flat.length-1){stopListen();toast("That's the end, for now.");return}
  showChapter(chIdx+1,"first",0,true);setTimeout(()=>{if(L.on)speakFrom(firstParaOnPage())},350);
}
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!L.wake)L.wake=await navigator.wakeLock.request("screen");
  if(!on&&L.wake){L.wake.release();L.wake=null}}catch(e){}}
function relayoutKeep(){const keep=L.on?L.para:null;const f=pages>1?page/(pages-1):0;layout();
  page=keep!=null?pageOfPara(keep):Math.min(pages-1,Math.round(f*(pages-1)));render(true)}
function startListen(){
  if(!TTS){toast("This phone doesn't support reading aloud.");return}
  L.on=true;$("#reader").classList.add("listening");$("#player").classList.remove("hidden");toggleChrome(false);
  relayoutKeep();keepAwake(true);
  setTimeout(()=>speakFrom(firstParaOnPage()),120);
}
function stopListen(){if(!L.on)return;stopSpeech();L.on=false;$("#player").classList.add("hidden");$("#reader").classList.remove("listening");
  document.querySelectorAll("#content p.reading").forEach(p=>p.classList.remove("reading"));relayoutKeep();keepAwake(false)}
function updatePlayer(){$("#plPlay").innerHTML=L.playing?ICON_PAUSE:ICON_PLAY;$("#plRate").textContent=S.rate.toFixed(2).replace(/0$/,"")+"\u00d7"}
function setRate(r){S.rate=Math.max(.5,Math.min(2,Math.round(r*20)/20));applySettings();updatePlayer();if(L.playing)speakFrom(L.para)}
$("#listenBtn").onclick=startListen;
$("#plPlay").onclick=()=>{if(L.playing)stopSpeech();else speakFrom(L.para)};
$("#plBack").onclick=()=>{const ps=[...document.querySelectorAll("#content p[data-i]")].map(p=>+p.dataset.i);const pv=[...ps].reverse().find(x=>x<L.para);speakFrom(pv??ps[0])};
$("#plSlower").onclick=()=>setRate(S.rate-.05);
$("#plFaster").onclick=()=>setRate(S.rate+.05);
$("#plStop").onclick=stopListen;

const fld=(id,label,type,extra)=>`<label class="fld"><span>${label}</span><input id="${id}" type="${type}" ${extra||""}></label>`;
function busy(btn,on,txt){btn.disabled=on;if(txt)btn.textContent=txt}

   ${fld("siPass","Password","password",'autocomplete="current-password"')}

/* sync: bring my books and books shared with me onto this phone */
let syncing=false;
const b64buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function runImports(){
  const {data:rows}=await sb.from("private_imports").select("id,key,files"); if(!rows||!rows.length)return 0;
  let n=0;
  for(const row of rows){
    const key=await crypto.subtle.importKey("raw",b64buf(row.key),"AES-GCM",false,["decrypt"]);
    let ok=true;
    for(const f of row.files){
      try{const buf=new Uint8Array(await (await fetch(f.path,{cache:"no-store"})).arrayBuffer());
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
        const bk=JSON.parse(new TextDecoder().decode(plain));
        const {error}=await sb.from("books").upsert({owner:me.id,book_key:bk.id,title:bk.title,subtitle:bk.subtitle||"",version:String(bk.version||1),data:bk,updated_at:new Date().toISOString()},{onConflict:"owner,book_key"});
        if(error)throw error; n++;
      }catch(e){ok=false}
    }
    if(ok)await sb.from("private_imports").delete().eq("id",row.id);
  }
  return n;
}
async function syncCloud(){
  if(!sb||!me||syncing||!navigator.onLine)return; syncing=true;
  try{
    await runImports();
    await pullState();
    const {data:rows,error}=await sb.from("books").select("id,book_key,owner,updated_at"); if(error)throw error;
    const local={}; (await idbAll()).forEach(b=>local[b.id]=b);
    let changed=0; const keys=[];
    for(const r of rows){
      keys.push(r.book_key);
      const l=local[r.book_key];
      if(l&&l._cloud===r.id&&l._u===r.updated_at)continue;
      const {data:full}=await sb.from("books").select("data").eq("id",r.id).single();
      if(!full)continue;
      const bk=Object.assign({},full.data,{id:r.book_key,_cloud:r.id,_owner:r.owner,_u:r.updated_at});
      await idbPut(bk); changed++;
    }
    for(const k of kv.get("cloudKeys",[]))if(!keys.includes(k)&&local[k]&&local[k]._cloud){await idbDel(k);changed++}
    kv.set("cloudKeys",keys);
    if(changed){await loadLibrary(true);toast(changed===1?"1 book updated.":changed+" books updated.")}
  }catch(e){console.log("[nook] sync",e)}
  syncing=false;
}
async function dropCloudBooks(){for(const b of await idbAll())if(b._cloud)await idbDel(b.id);kv.set("cloudKeys",[]);await loadLibrary(true)}
window.addEventListener("online",()=>me&&syncCloud());

/* places and notes follow the account automatically */
const syncable=k=>/^(pos|notes):/.test(k);
const _kvset=kv.set.bind(kv);
let upT=null;
kv.set=function(k,v){_kvset(k,v);if(syncable(k)){const st=kv.get("stamps",{});st[k]=Date.now();_kvset("stamps",st);if(me){clearTimeout(upT);upT=setTimeout(pushState,2500)}}};
async function pushState(){
  if(!sb||!me||!navigator.onLine)return;
  const st=kv.get("stamps",{}),data={};
  for(const k in st)data[k]={v:kv.get(k,null),t:st[k]};
  try{const {data:row}=await sb.from("user_state").select("data").eq("user_id",me.id).maybeSingle();
    const merged=Object.assign({},(row&&row.data)||{});
    for(const k in data)if(!merged[k]||merged[k].t<=data[k].t)merged[k]=data[k];
    await sb.from("user_state").upsert({user_id:me.id,data:merged,updated_at:new Date().toISOString()});
  }catch(e){console.log("[nook] push",e)}
}
async function pullState(){
  try{const {data:row}=await sb.from("user_state").select("data").eq("user_id",me.id).maybeSingle();
    const st=kv.get("stamps",{});let n=0;
    if(LS)for(let i=0;i<LS.length;i++){const k=LS.key(i);if(syncable(k)&&!st[k])st[k]=1}
    if(row&&row.data)for(const k in row.data){const r=row.data[k];if(!st[k]||st[k]<r.t){_kvset(k,r.v);st[k]=r.t;n++}}
    _kvset("stamps",st);
    if(n&&!$("#library").classList.contains("hidden"))renderShelf();
    await pushState();
  }catch(e){console.log("[nook] pull",e)}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&me){clearTimeout(upT);pushState()}});

/* profile page */
async function showProfile(){
  $("#library").classList.add("hidden"); $("#profile").classList.remove("hidden");
  const P=$("#profileBody"); P.innerHTML='<p class="empty">Loading…</p>';
  if(!navigator.onLine){P.innerHTML='<p class="empty">You\'re offline. Your profile needs the internet. Your books still work offline.</p>'+signOutBtn();bindSignOut();return}
  try{
    const [{data:prof},{data:mine},{data:all},{data:shares}]=await Promise.all([
      sb.from("profiles").select("username,display_name").eq("id",me.id).single(),
      sb.from("books").select("id,title,subtitle").eq("owner",me.id).order("created_at"),
      sb.from("books").select("id,title,subtitle,owner").neq("owner",me.id),
      sb.from("book_shares").select("book_id,user_id")]);
    const ids=[...new Set([...(shares||[]).map(s=>s.user_id),...(all||[]).map(b=>b.owner)])];
    const {data:people}=ids.length?await sb.from("profiles").select("id,username").in("id",ids):{data:[]};
    const name=id=>((people||[]).find(p=>p.id===id)||{}).username||"someone";
    const cnt=id=>(shares||[]).filter(s=>s.book_id===id).length;
    const dn=(prof&&prof.display_name)||"";
    P.innerHTML=`<div class="pf-head"><div class="avatar">${esc(((prof&&prof.username)||"?")[0].toUpperCase())}</div>
      <div><input id="pfName" class="pf-name" value="${esc(dn)}" placeholder="Your name" maxlength="40"><div class="pf-sub">@${esc(prof?prof.username:"")} &middot; ${esc(me.email||"")}</div></div></div>
      <h4>My books</h4>
      ${(mine&&mine.length)?mine.map(b=>`<div class="pf-row"><div><b>${esc(b.title)}</b><small>${cnt(b.id)?`Shared with ${cnt(b.id)} ${cnt(b.id)>1?"people":"person"}`:"Private"}</small></div>
        <button class="pill" data-share="${b.id}" data-t="${esc(b.title)}">Share</button></div>`).join(""):'<p class="empty">No books yet. Import a book on the home screen and it saves to your account, private.</p>'}
      <h4>Shared with me</h4>
      ${(all&&all.length)?all.map(b=>`<div class="pf-row"><div><b>${esc(b.title)}</b><small>from @${esc(name(b.owner))}</small></div>
        <button class="pill danger-ghost" data-leave="${b.id}">Remove</button></div>`).join(""):'<p class="empty">Nothing yet. When someone shares a book with your username, it appears here and on your shelf.</p>'}
      ${signOutBtn()}`;
    $("#pfName").onchange=async e=>{const {error}=await sb.from("profiles").update({display_name:e.target.value.trim()}).eq("id",me.id);toast(error?"Couldn't save.":"Name saved.")};
    P.onclick=async e=>{const s=e.target.closest("[data-share]"),l=e.target.closest("[data-leave]");
      if(s)shareSheet(s.dataset.share,s.dataset.t);
      if(l){await sb.from("book_shares").delete().eq("book_id",l.dataset.leave).eq("user_id",me.id);toast("Removed.");await syncCloud();showProfile()}};
    bindSignOut();
  }catch(e){P.innerHTML='<p class="empty">Couldn\'t load your profile. Check your connection.</p>'+signOutBtn();bindSignOut()}
}
const signOutBtn=()=>'<div class="lib-actions"><button class="pill danger-ghost" id="pfOut">Sign out</button></div><p class="note-small">Signing out removes account books from this phone. Your notes and places stay.</p>';
function bindSignOut(){$("#pfOut").onclick=async()=>{await sb.auth.signOut();hideProfile();toast("Signed out.")}}
function hideProfile(){$("#profile").classList.add("hidden");$("#library").classList.remove("hidden");renderShelf()}
$("#pfBack").onclick=hideProfile;
async function shareSheet(bookId,title){
  const {data:sh}=await sb.from("book_shares").select("user_id").eq("book_id",bookId);
  const ids=(sh||[]).map(s=>s.user_id);
  const {data:people}=ids.length?await sb.from("profiles").select("id,username").in("id",ids):{data:[]};
  openSheet(`<h3>Share "${esc(title)}"</h3>
    ${(people&&people.length)?people.map(p=>`<div class="pf-row"><div><b>@${esc(p.username)}</b></div><button class="pill danger-ghost" data-un="${p.id}">Stop sharing</button></div>`).join(""):'<p class="empty">Only you can read this book.</p>'}
    ${fld("shUser","Add someone by username","text",'autocapitalize="none"')}
    <div class="lib-actions" style="margin-top:14px"><button class="pill gold" id="shGo">Share</button></div>`);
  $("#sheet").onclick=async e=>{const u=e.target.closest("[data-un]");if(!u)return;
    await sb.from("book_shares").delete().eq("book_id",bookId).eq("user_id",u.dataset.un);toast("Stopped sharing.");shareSheet(bookId,title);showProfile()};
  $("#shGo").onclick=async()=>{const un=$("#shUser").value.trim().replace(/^@/,"").toLowerCase();if(!un)return;
    const {data:p}=await sb.from("profiles").select("id,username").eq("username",un).maybeSingle();
    if(!p)return toast("No one has that username.");
    if(p.id===me.id)return toast("That's you!");
    const {error}=await sb.from("book_shares").insert({book_id:bookId,user_id:p.id});
    toast(error?(/duplicate/.test(error.message)?"Already shared with them.":"Couldn't share."):`Shared with @${p.username}.`);
    shareSheet(bookId,title);showProfile()};
}
async function uploadIfSignedIn(b){
  if(!sb||!me||(b._owner&&b._owner!==me.id))return false;
  const {error}=await sb.from("books").upsert({owner:me.id,book_key:b.id,title:b.title,subtitle:b.subtitle||"",version:String(b.version||1),data:b,updated_at:new Date().toISOString()},{onConflict:"owner,book_key"});
  if(!error)setTimeout(syncCloud,0); return !error;
}
initCloud();

loadLibrary();
})();
